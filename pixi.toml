[workspace]
authors = ["Giovanni Dejan <giovanni.dejan@binus.ac.id>"]
channels = ["conda-forge"]
name = "VQA_CNN-LSTM"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build_vocab = "python3 build_vocab.py"
train = "python3 train.py"
test = "python3 test.py"

[system-requirements]
cuda = "12.0"

[dependencies]
python = ">=3.13,<3.14"
pytorch-gpu = ">=2.9.1,<3"
torchvision = ">=0.24.1,<0.25"
numpy = ">=2.3.5,<3"
pillow = ">=12.0.0,<13"
datasets = ">=4.4,<4.5"
evaluate = ">=0.4.6,<0.5"
pip = ">=25.3,<26"
